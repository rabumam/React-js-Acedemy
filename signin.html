<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Panel Login</title>
</head>
<body>

<table>
    <tr>
        <!-- Left Column -->
        <td>
            <img src="image.png" alt="Orderific">
            <img src="deliveryman.png" alt="Delivery Person">
            <h1>Service Panel</h1>
            <p>Streamline your restaurant operations with BMS. Manage reservations, orders, inventory, and staff effortlessly and focus on delivering exceptional dining experiences.</p>
        </td>

        <!-- Right Column -->
        <td>
            <h2>Welcome Back</h2>
            <p>Manage, streamline, and thrive effortlessly.</p>
            
            <form>
                <label for="email">Email</label><br>
                <input type="email" id="email" placeholder="Enter email address"><br>

                <label for="password">Password</label><br>
                <input type="password" id="password" placeholder="Password"><br>

                <div>
                    <input type="checkbox" id="remember">
                    <label for="remember">Remember me</label>
                    <a href="#">Login with Code</a>
                </div>

                <button type="submit">Sign In</button>
            </form>
        </td>
    </tr>
</table>

</body>
</html>
